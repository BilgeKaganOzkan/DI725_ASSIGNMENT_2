# Deformable DETR Configuration
# Controls model architecture, training parameters, and evaluation settings

model:
  name: "DeformableDetr"
  # Core architecture parameters - optimized for speed (4x faster training)
  hidden_dim: 64         # Reduced feature dimension for faster training (was 128)
  nheads: 2              # Reduced attention heads for faster computation (was 4)
  num_encoder_layers: 2  # Reduced encoder depth for faster training (was 3)
  num_decoder_layers: 2  # Reduced decoder depth for faster training (was 3)
  dim_feedforward: 256   # Reduced FFN dimension for faster computation (was 512)
  dropout: 0.05          # Kept same regularization strength

  # Deformable attention parameters - optimized for speed
  num_feature_levels: 3  # Using 3 feature pyramid levels to match model architecture
  dec_n_points: 2        # Reduced decoder sampling points for faster computation (was 4)
  enc_n_points: 2        # Reduced encoder sampling points for faster computation (was 4)
  num_queries: 100       # Reduced object detection capacity for faster training (was 200)
  aux_loss: False        # Disabled auxiliary losses for faster training (was True)

# Dataset configuration
# Defines data sources, preprocessing, and memory management
dataset:
  name: "AU-AIR"                # Dataset identifier
  num_classes: 8                # Number of object categories
  class_names: ["Human", "Car", "Truck", "Van", "Motorbike", "Bicycle", "Bus", "Trailer"]  # Class labels
  train_path: "dataset/train"   # Training data location
  val_path: "dataset/val"       # Validation data location
  test_path: "dataset/test"     # Test data location
  img_size: [256, 384]          # Reduced input dimensions for faster processing (was [384, 576])
  normalize:                    # ImageNet normalization values
    mean: [0.485, 0.456, 0.406] # RGB means
    std: [0.229, 0.224, 0.225]  # RGB standard deviations
  # Memory management
  cache_images: True            # Enable in-memory caching
  cache_limit: 500              # Maximum cached images (prevents OOM errors)


# Training configuration
# Core training hyperparameters and optimization settings
training:
  # Primary training parameters - optimized for speed
  batch_size: 16       # Increased batch size for faster training (was 32)
  lr: 5e-4             # Increased learning rate for faster convergence (was 2e-4)
  weight_decay: 1e-4   # Kept same regularization strength
  lr_backbone: 2e-5    # Increased backbone learning rate for faster training (was 1e-5)
  epochs: 5            # Reduced total training epochs for faster completion (was 50)
  lr_drop: 4           # Adjusted learning rate decay point (was 40)
  clip_max_norm: 0.5   # Kept same gradient clipping threshold

  # Process control parameters
  seed: 2697134         # Deterministic initialization seed
  save_checkpoint_every: 5  # Model saving frequency (epochs)
  validate_every: 1         # Evaluation frequency (epochs)
  log_interval: 64          # Metrics logging frequency (batches)

  # Data loading optimization - maximized for speed
  # These settings significantly impact training throughput
  num_workers: 12       # Further increased parallel data loading threads for faster loading
  prefetch_factor: 1    # Further increased samples to preload per worker for better throughput
  pin_memory: True     # Kept fast CPU-to-GPU memory transfer
  mixed_precision: True  # Kept reduced precision for faster computation

  # Dataset caching strategy - optimized for faster training
  # Controls memory-speed tradeoff during training
  cache_size_train: 8000   # Increased training samples to keep in memory for better hit rate
  cache_size_val: 3000     # Increased validation samples to keep in memory for better hit rate
  preload_size_train: 1000 # Increased training samples to load at startup for faster initial epochs
  preload_size_val: 500    # Increased validation samples to load at startup for faster validation

  # Loss function weights
  # Balances different aspects of detection quality
  loss_weights:
    loss_ce: 3.0           # Classification weight (higher = prioritize correct classes)
    loss_bbox: 5.0         # Box coordinate weight (higher = prioritize precise localization)
    loss_giou: 3.0         # Box overlap weight (higher = prioritize better IoU)
    loss_cardinality: 0.3  # Object count weight (higher = prioritize correct object count)

  # Hardware acceleration settings - maximized for extreme speed
  # PyTorch performance optimizations for modern GPUs
  mixed_precision: True   # Use lower precision where possible
  precision: "fp16"      # Use FP16 for maximum speed
  pin_memory: True        # Use pinned (non-pageable) memory
  grad_accumulation: 4    # Further increased batches per weight update for faster training (was 2)
  benchmark_cudnn: True   # Auto-tune cuDNN algorithms
  compile_model: True     # Use PyTorch 2.0 compilation
  jit_optimize: True      # Just-in-time compilation
  use_tf32: True          # TensorFloat32 math (A100/A10/RTX30xx+)

  # Memory management - optimized for maximum speed
  # GPU memory allocation and optimization
  memory_management:
    empty_cache_freq: 50   # More frequent CUDA cache clearing to prevent fragmentation
    adaptive_batch_size: False  # Keep fixed batch size for consistent performance
    min_batch_size: 16  # Minimum batch size if adaptive

    # GPU memory settings
    force_gpu_memory_usage: True  # Keep tensors on GPU for faster access
    gpu_memory_fraction: 0.98  # Slightly reduced to prevent OOM errors

    # Attention computation chunking - optimized for speed
    # Controls memory usage during self-attention
    chunk_size_large: 64000   # Further increased large tensor operation chunk size for faster processing
    chunk_size_small: 4000    # Further increased small tensor operation chunk size for faster processing
    use_checkpoint: True      # Kept gradient checkpointing disabled for faster training

# Optimizer configuration
# Weight update algorithm and learning rate schedule
optimizer:
  type: "AdamW"           # Optimization algorithm (AdamW best for transformers)
  lr: 1e-3                # Increased initial learning rate for faster convergence (was 5e-4)
  weight_decay: 1e-5      # Reduced weight decay for faster training (was 5e-5)
  scheduler_type: "step"  # Changed to step scheduler for faster training (was onecycle)
  lr_step_size: 15        # Adjusted epochs between LR changes (was 40)
  lr_gamma: 0.1           # Kept same LR reduction factor

# Weights & Biases logging
# Experiment tracking and visualization settings
wandb:
  project: "2697134-assignment2"  # Project identifier
  entity: "ozkan-bilge-middle-east-technical-university"  # Account name
  name: "deformable-detr"  # Run name
  tags: ["deformable-detr", "object-detection"]  # Searchable labels

# Evaluation configuration
# Model assessment metrics and settings
evaluation:
  batch_size: 32          # Evaluation batch size
  iou_thresholds: [0.1, 0.3, 0.5, 0.7, 0.9]  # Overlap thresholds for metrics
  conf_threshold: 0.1     # Minimum detection confidence
  max_detections: 100     # Maximum detections per image
  save_visualizations: True  # Generate detection visualizations
  metrics:                # Performance metrics to calculate
    compute_precision: True    # Precision (TP/(TP+FP))
    compute_recall: True       # Recall (TP/(TP+FN))
    compute_f1: True           # F1 score (harmonic mean of precision/recall)
    compute_accuracy: True     # Overall accuracy
    compute_map: True          # Mean Average Precision
    compute_confusion_matrix: True  # Class confusion statistics

# Inference configuration
# Deployment and prediction settings
inference:
  conf_threshold: 0.1    # Detection confidence threshold
  iou_threshold: 0.3     # NMS overlap threshold
  device: "cuda"         # Inference hardware ("cuda" or "cpu")
  batch_size: 1          # Inference batch size
  visualize: True        # Create detection visualizations
  save_results: True     # Save predictions to disk
  output_dir: "results"  # Results output location